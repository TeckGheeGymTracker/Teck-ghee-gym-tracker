name: Collect Teck Ghee Gym Crowd Data

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run collector
        run: |
          python collector/collect.py

      - name: Save updated data
        run: |
          git config --global user.name "TeckGheeGymTracker"
          git config --global user.email "actions@github.com"
          git add data/crowd_data.json
          git commit -m "Update crowd data" || exit 0
          git push

